[project]
name = "c216-strategy-lab"
version = "0.1.0"
description = "Comparador reproduzível de estratégias de investimento"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn>=0.52.4,<0.53.0",
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "alembic (>=1.14,<2.0)",
]

[dependency-groups]
dev = ["httpx2>=2.12.0,<3.0.0", "pytest>=9.1.1,<10.0.0", "ruff>=0.16.4,<0.17.0"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "investment_lab", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
