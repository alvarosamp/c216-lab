[project]
name = "backend"
version = "0.1.0"
description = "API para controle financeiro."
authors = [
    { name = "Álvaro Careli", email = "alvaro.sampaio@gec.inatel.br" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn>=0.52.4,<0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.4,<0.17.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "backend", from = "src" },
]
